name: Задание не получается
description: Задание не засчитывается, непонятно, что делать, или оно работает не так
title: "Задание: "
labels: ["bug", "задание"]
body:
  - type: markdown
    attributes:
      value: |
        Заявка публичная: не пишите сюда имя, почту и другие личные данные.
        Номер задания и что вы нажимали тренажёр уже вписал ниже.
  - type: textarea
    id: what
    attributes:
      label: Что делали
      description: Какие шаги и что получилось. Если непонятен текст задания — что именно.
      placeholder: "Удалил слово через Ctrl+Backspace и вставил термин из CAT — задание не засчиталось."
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Задание
  - type: textarea
    id: context
    attributes:
      label: Сведения от тренажёра
      description: Заполняются сами — задание, ход, версия, платформа, браузер. Можно не трогать.
      render: text
